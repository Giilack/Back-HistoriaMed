spring.application.name=historiamed-backend

# --- Servidor ---
# En la nube la plataforma indica el puerto con la variable PORT
server.port=${PORT:8080}
# Detrás de un proxy (Render, Vercel) poner FORWARD_HEADERS=framework: así se registra la IP real del usuario y
# no la del proxy. En local se deja en none: sin proxy, esas cabeceras las podría falsificar cualquiera.
server.forward-headers-strategy=${FORWARD_HEADERS:none}

# Credenciales locales en backend/.env (ignorado por Git; ver .env.example). En producción: variables de entorno.
spring.config.import=optional:file:.env[.properties]

# --- Base de datos (PostgreSQL local, base Db-Med) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Db-Med}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate: el esquema lo gestiona Flyway, Hibernate solo lo valida ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway: migraciones en src/main/resources/db/migration (V1__descripcion.sql, V2__...) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Seguridad (JWT_SECRET: mínimo 32 caracteres, definido en .env) ---
historiamed.jwt.secret=${JWT_SECRET}
historiamed.jwt.access-token-minutos=30
historiamed.jwt.refresh-token-dias=7
historiamed.seguridad.max-intentos-fallidos=5
historiamed.seguridad.minutos-bloqueo=15
# En producción (HTTPS) poner COOKIE_SECURE=true
historiamed.seguridad.cookie-secure=${COOKIE_SECURE:false}
historiamed.cors.origenes=${CORS_ORIGENES:http://localhost:5173}
# CAPTCHA (Cloudflare Turnstile) tras 3 intentos fallidos con el mismo usuario. Sin TURNSTILE_SECRET queda desactivado.
historiamed.captcha.secreto=${TURNSTILE_SECRET:}
historiamed.captcha.intentos-sin-captcha=3
historiamed.captcha.url-verificacion=https://challenges.cloudflare.com/turnstile/v0/siteverify

# --- Primer ADMIN: se crea al arrancar solo si no existe ningún ADMIN (debe cambiar la contraseña al ingresar) ---
historiamed.admin-inicial.username=${ADMIN_INICIAL_USERNAME:}
historiamed.admin-inicial.password=${ADMIN_INICIAL_PASSWORD:}

# --- Actuator: exponer solo el endpoint de salud ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Documentos clínicos: máximo 10 MB por archivo ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Dónde se guardan los archivos: local (disco) o bd (PostgreSQL; para la nube, donde el disco se borra al reiniciar)
historiamed.almacenamiento.tipo=${ALMACENAMIENTO_TIPO:local}
# Carpeta del almacenamiento local (relativa a backend/). Ignorada por Git: contiene datos de pacientes.
historiamed.almacenamiento.directorio=${ALMACENAMIENTO_DIR:uploads}

# --- Datos de demostración ficticios (solo con DEMO=true y en una base sin pacientes) ---
historiamed.demo.habilitada=${DEMO:false}

# --- Cifrado de datos sensibles del paciente (AES-256-GCM): clave de 32 bytes en Base64, definida en .env ---
# Si se pierde, el documento, los teléfonos y la dirección de los pacientes no se pueden recuperar: respáldela.
historiamed.cifrado.clave=${CIFRADO_CLAVE:}
