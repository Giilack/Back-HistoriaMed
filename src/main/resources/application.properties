spring.application.name=historiamed-backend

# --- Base de datos (valores por defecto = docker-compose.yml; en producción usar variables de entorno) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/historiamed}
spring.datasource.username=${DB_USERNAME:historiamed}
spring.datasource.password=${DB_PASSWORD:historiamed_dev}

# --- JPA / Hibernate: el esquema lo gestiona Flyway, Hibernate solo lo valida ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway: migraciones en src/main/resources/db/migration (V1__descripcion.sql, V2__...) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Actuator: exponer solo el endpoint de salud ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
