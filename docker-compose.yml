services:
  postgres:
    # PostgreSQL 17 con la extensión pgvector (búsqueda semántica para el módulo de IA)
    image: pgvector/pgvector:pg17
    container_name: historiamed-postgres
    environment:
      POSTGRES_DB: historiamed
      POSTGRES_USER: historiamed
      POSTGRES_PASSWORD: historiamed_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U historiamed -d historiamed"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
